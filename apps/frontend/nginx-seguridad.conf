# Cabeceras de seguridad (#45). Se incluye en el server y en cada location que use add_header, porque
# nginx no hereda add_header hacia un location que define los suyos.
#
# CSP: solo el propio origen más Stripe (js, iframes y API) y las fuentes de Google. Los estilos inline
# hacen falta por Angular; los scripts inline no se permiten. Ajustar aquí si se añaden terceros.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.stripe.com https://m.stripe.network; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
