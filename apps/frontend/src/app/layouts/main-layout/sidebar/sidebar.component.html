<aside class="sidebar">
  <button
    type="button"
    class="sidebar__brand"
    [attr.aria-label]="
      auth.isAdmin()
        ? (mostrarAdminChrome() ? 'Ver la tienda como cliente' : 'Volver al panel de administración')
        : 'Ir al inicio'
    "
    (click)="brandClick.emit()"
  >
    <app-logo />
    <span class="sidebar__brand-name font-display">BiblioHub</span>
  </button>

  <nav class="sidebar__nav" aria-label="Navegación principal">
    <div class="sidebar__nav-links">
      @if (mostrarAdminChrome()) {
        <a routerLink="/dashboard" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          Dashboard
        </a>
        <a routerLink="/inventario" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 4 7v10l8 4 8-4V7l-8-4Z" />
            <path d="M4 7l8 4 8-4" />
            <path d="M12 11v10" />
          </svg>
          Inventario
        </a>
        <a routerLink="/ventas" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="2" />
            <circle cx="12" cy="12" r="3" />
            <path d="M6 9h.01M18 15h.01" stroke-linecap="round" />
          </svg>
          Ventas
        </a>
        <a routerLink="/clientes" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="8" r="3" />
            <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
            <circle cx="17" cy="9" r="2.3" />
            <path d="M15.3 14.2A5 5 0 0 1 21 19" />
          </svg>
          Clientes
        </a>
        <a routerLink="/proveedores" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="1.5" y="7" width="13" height="10" rx="1.5" />
            <path d="M14.5 10h4l3 3v4h-7z" />
            <circle cx="6.5" cy="19" r="1.8" />
            <circle cx="17.5" cy="19" r="1.8" />
          </svg>
          Proveedores
        </a>
        <a routerLink="/reportes" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20V10M10 20V4M16 20v-7" stroke-linecap="round" />
            <path d="M2 20h20" stroke-linecap="round" />
          </svg>
          Reportes
        </a>
        <a routerLink="/configuracion" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 13a7.97 7.97 0 0 0 0-2l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.3 2.6a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a8 8 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1L11 21h4l.3-2.6a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5Z"
            />
          </svg>
          Configuración
        </a>
      } @else {
        <a routerLink="/inicio" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11 12 3l9 8" />
            <path d="M5 10v10h14V10" />
            <path d="M9 20v-6h6v6" />
          </svg>
          Inicio
        </a>
        <a routerLink="/categorias" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="8" height="8" rx="1.5" />
            <rect x="13" y="3" width="8" height="8" rx="1.5" />
            <rect x="3" y="13" width="8" height="8" rx="1.5" />
            <rect x="13" y="13" width="8" height="8" rx="1.5" />
          </svg>
          Categorías
        </a>
        <a routerLink="/lista-deseos" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 20s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 5c-2.5 4.6-9.5 9-9.5 9Z"
            />
          </svg>
          Lista de deseos
        </a>
        <a routerLink="/mis-pedidos" routerLinkActive="is-active" class="sidebar__nav-item">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2h12v20l-3-2-3 2-3-2-3 2Z" />
            <path d="M9 8h6M9 12h6" stroke-linecap="round" />
          </svg>
          Mis pedidos
        </a>
      }
    </div>

    @if (!mostrarAdminChrome() && auth.isAdmin()) {
      <div class="sidebar__nav-bottom">
        <button type="button" class="sidebar__nav-item" (click)="brandClick.emit()">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4 3 9l5 5" />
            <path d="M3 9h11a5 5 0 0 1 5 5v1" />
          </svg>
          Volver al panel admin
        </button>
      </div>
    } @else if (!mostrarAdminChrome() && auth.isAuthenticated()) {
      <div class="sidebar__nav-bottom">
        <button type="button" class="sidebar__nav-item" (click)="logout.emit()">
          <svg class="sidebar__nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          Cerrar sesión
        </button>
      </div>
    }
  </nav>
</aside>
