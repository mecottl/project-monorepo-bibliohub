<div class="main-layout">
  @if (menuAbierto()) {
    <div class="main-layout__backdrop" (click)="cerrarMenu()"></div>
  }

  <app-sidebar
    [mostrarAdminChrome]="mostrarAdminChrome()"
    [abierto]="menuAbierto()"
    (brandClick)="onLogoClick()"
    (logout)="onLogout()"
  />

  <div class="main-layout__main">
    @if (auth.isAdmin() && vistaCliente()) {
      <div class="main-layout__preview-banner">
        Estás viendo la tienda como la ve un cliente.
        <button type="button" (click)="onLogoClick()">Volver al panel de administración</button>
      </div>
    }

    <app-topbar
      [mostrarAdminChrome]="mostrarAdminChrome()"
      [menuAbierto]="menuAbierto()"
      (menuToggle)="onMenuToggle()"
      (logout)="onLogout()"
    />

    <main class="main-layout__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
