<header class="topbar">
  <button
    type="button"
    class="topbar__menu-btn"
    [attr.aria-expanded]="menuAbierto()"
    aria-label="Abrir menú de navegación"
    (click)="menuToggle.emit()"
  >
    <svg-menu />
  </button>

  <div class="topbar__spacer"></div>

  @if (mostrarAdminChrome()) {
    <div class="topbar__actions">
      <span class="topbar__link topbar__link--placeholder">Notificaciones</span>
      <span class="topbar__link topbar__link--placeholder">Perfil</span>
      <span class="topbar__divider"></span>
      <button type="button" class="topbar__link" (click)="logout.emit()">Cerrar sesión</button>
    </div>
  } @else {
    <div class="topbar__actions">
      <button type="button" class="topbar__icon-btn" aria-label="Carrito">
        <svg-carrito />
      </button>

      <span class="topbar__divider"></span>

      @if (auth.currentUser(); as user) {
        <span class="topbar__user-chip">
          <span class="topbar__avatar" aria-hidden="true">
            <svg-usuario />
          </span>
          <span class="topbar__user-name">{{ user.nombre }}</span>
        </span>
      } @else {
        <a routerLink="/login" class="topbar__icon-btn" aria-label="Iniciar sesión">
          <p>Iniciar sesión</p>
          <svg-usuario />
        </a>
      }
    </div>
  }
</header>
