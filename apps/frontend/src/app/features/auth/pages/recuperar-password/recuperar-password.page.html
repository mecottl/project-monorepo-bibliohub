<div class="login-page__card">
  <a routerLink="/" class="login-page__back">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M19 12H5M11 6l-6 6 6 6"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    Volver al inicio
  </a>

  <span class="login-page__kicker">Recuperación</span>
  <h2>Recuperar contraseña</h2>

  @if (error()) {
    <p class="login-page__error">{{ error() }}</p>
  }

  @if (mensaje()) {
    <p class="login-page__subtitle" role="status">{{ mensaje() }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="identificador">Correo o teléfono</label>
        <input
          id="identificador"
          type="text"
          formControlName="identificador"
          placeholder="correo@ejemplo.com o 9991234567"
          autocomplete="username"
        />
      </div>

      <button type="submit" class="login-page__submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </form>
  }

  <p class="login-page__footer">
    <a routerLink="/login">Volver a iniciar sesión</a>
  </p>
</div>
