<div class="login-page">

  <div class="login-page__brand">
    <app-auth-slideshow />
  </div>

  <div class="login-page__form-wrapper">
    <div class="login-page__card">

      <a routerLink="/" class="login-page__back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Volver al inicio
      </a>

      <span class="login-page__kicker">Nuevo cliente</span>
      <h2>Crear cuenta</h2>
      <p class="login-page__subtitle">Regístrate con tu número de teléfono</p>

      @if (error()) {
        <p class="login-page__error">{{ error() }}</p>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" formControlName="nombre" placeholder="Tu nombre" autocomplete="name" />
        </div>

        <div class="field">
          <label for="telefono">Teléfono</label>
          <input
            id="telefono"
            type="tel"
            formControlName="telefono"
            placeholder="9991234567"
            autocomplete="tel"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="login-page__submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

      </form>

      <p class="login-page__footer">
        ¿Ya tienes una cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>

</div>
