<div class="login-page">

  <div class="login-page__brand">
    <app-auth-slideshow />
  </div>

  <div class="login-page__form-wrapper">
    <div class="login-page__card">

      <a routerLink="/" class="login-page__back">← Volver al inicio</a>

      <h2>Crear cuenta</h2>
      <p class="login-page__subtitle">Regístrate con tu número de teléfono</p>

      @if (error()) {
        <p class="login-page__error">{{ error() }}</p>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" formControlName="nombre" placeholder="Tu nombre" autocomplete="name" />
        </div>

        <div class="field">
          <label for="telefono">Teléfono</label>
          <input
            id="telefono"
            type="tel"
            formControlName="telefono"
            placeholder="9991234567"
            autocomplete="tel"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn-primary" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>

      </form>

      <p class="login-page__footer">
        ¿Ya tienes una cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>

</div>
