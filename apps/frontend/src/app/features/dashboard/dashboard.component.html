<section class="dashboard">
  <h1 class="font-display">Dashboard</h1>
  @if (auth.currentUser(); as user) {
    <p class="dashboard__saludo">Bienvenido, {{ user.nombre }}</p>
  }

  <div class="dashboard__stats">
    <app-stat-card label="Ventas hoy" [value]="ventasHoy()" [hint]="montoHoyFormateado()" />
    <app-stat-card label="Ventas últimos 7 días" [value]="ventasSemana()" [hint]="montoSemanaFormateado()" />
    <app-stat-card label="Libros con stock bajo" [value]="stockBajo().length" />
  </div>

  <div class="dashboard__secciones">
    <section class="dashboard__seccion">
      <h2 class="font-display">Ventas — últimos 30 días</h2>
      <div class="dashboard__chart">
        <app-chart [config]="chartVentasSemana()" />
      </div>
    </section>

    <section class="dashboard__seccion">
      <div class="dashboard__seccion-header">
        <h2 class="font-display">Más vendidos</h2>
        <a routerLink="/reportes">Ver reportes →</a>
      </div>
      <div class="dashboard__chart">
        <app-chart [config]="chartMasVendidos()" />
      </div>
    </section>

    <section class="dashboard__seccion">
      <div class="dashboard__seccion-header">
        <h2 class="font-display">Stock bajo</h2>
        <a routerLink="/inventario">Ver inventario →</a>
      </div>
      <app-data-table
        [columns]="columnasStockBajo"
        [data]="stockBajo()"
        [loading]="loading()"
        trackByKey="id"
      />
    </section>
  </div>
</section>
