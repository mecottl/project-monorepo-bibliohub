<section class="reportes">
  <h1 class="font-display">Reportes</h1>
  <app-reportes-tabs />

  <div class="reportes__filtros">
    <label>
      Desde
      <input type="date" [ngModel]="fechaDesde()" (ngModelChange)="onFechaDesdeChange($event)" />
    </label>
    <label>
      Hasta
      <input type="date" [ngModel]="fechaHasta()" (ngModelChange)="onFechaHastaChange($event)" />
    </label>
  </div>

  <div class="reportes__stats">
    <app-stat-card label="Ventas en el período" [value]="totalVentasPeriodo()" />
    <app-stat-card label="Monto total en el período" [value]="'$' + montoTotalPeriodo().toFixed(2)" />
  </div>

  <section class="reportes__seccion">
    <div class="reportes__seccion-header">
      <h2 class="font-display">Ventas por día</h2>
      <button type="button" class="btn-outline" (click)="exportarVentasPorDia()">Descargar Excel</button>
    </div>
    <app-data-table
      [columns]="columnasVentasPorDia"
      [data]="ventasPorDia()"
      [loading]="loading()"
      trackByKey="fecha"
    />
  </section>

  <section class="reportes__seccion">
    <div class="reportes__seccion-header">
      <h2 class="font-display">Rendimiento por empleado</h2>
      <button type="button" class="btn-outline" (click)="exportarRendimiento()">Descargar Excel</button>
    </div>
    <app-data-table
      [columns]="columnasRendimiento"
      [data]="rendimiento()"
      [loading]="loading()"
      trackByKey="id"
    />
  </section>

  <section class="reportes__seccion">
    <div class="reportes__seccion-header">
      <h2 class="font-display">Libros más vendidos</h2>
      <button type="button" class="btn-outline" (click)="exportarMasVendidos()">Descargar Excel</button>
    </div>
    <app-data-table
      [columns]="columnasMasVendidos"
      [data]="masVendidos()"
      [loading]="loading()"
      trackByKey="id"
    />
  </section>
</section>
