<section class="libros-listado">
  <header class="libros-listado__header">
    <h1 class="font-display">Inventario — Libros</h1>
    @if (!auth.isCajero()) {
      <div class="libros-listado__header-actions">
        <a routerLink="/inventario/catalogo" class="btn-outline">Autores / editoriales / categorías</a>
        <button type="button" class="btn-primary" (click)="irACrear()">+ Nuevo libro</button>
      </div>
    }
  </header>

  <app-search-input
    ariaLabel="Buscar libro por título, autor o ISBN"
    placeholder="Buscar por título, autor o ISBN…"
    (search)="onSearch($event)"
  />

  <div class="libros-listado__filtros">
    <button
      type="button"
      class="libros-listado__chip"
      [class.is-activo]="soloStockBajo()"
      [attr.aria-pressed]="soloStockBajo()"
      (click)="alternarStockBajo()"
    >
      Solo stock bajo
    </button>
    @if (soloStockBajo()) {
      <span class="libros-listado__conteo">{{ total() }} {{ total() === 1 ? 'libro' : 'libros' }} por reabastecer</span>
    }
  </div>

  <app-data-table
    [columns]="columns"
    [data]="libros()"
    [loading]="loading()"
    trackByKey="id"
    [sortLocal]="false"
    (sortChange)="onOrden($event)"
    [rowActionsTemplate]="auth.isCajero() ? null : acciones"
    (rowClick)="onRowClick($event)"
  >
    <app-empty-state
      emptyState
      title="No hay libros que coincidan"
      description="Prueba con otro término de búsqueda o crea un libro nuevo."
    />
  </app-data-table>

  <ng-template #acciones let-libro>
    <button type="button" class="libros-listado__accion" (click)="irAMovimiento(libro)">
      Movimiento
    </button>
    <button type="button" class="libros-listado__accion" (click)="pedirEliminar(libro)">
      Eliminar
    </button>
  </ng-template>

  <app-pagination
    [page]="page()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)"
  />

  <app-confirm-modal
    [open]="libroAEliminar() !== null"
    title="Eliminar libro"
    [message]="eliminarMensaje()"
    confirmLabel="Eliminar"
    (confirmed)="confirmarEliminar()"
    (cancelled)="cancelarEliminar()"
  />
</section>
